# best case
params:
  seq_len: ${dataset.seq_len}
  c_in: 1  # Входная размерность (1D последовательность)
  c_out: 1  # Выходная размерность канала (1D)
  pred_dim: ${dataset.seq_len}  # Размерность предсказания = длина последовательности

  padding_patch: True

  affine: False
  individual: False
  subtract_last: False
  decomposition: False
  kernel_size: 25
  activation: 'gelu'

  pre_norm: False
  res_attention: True
  store_attn: False
  activation_type: 'tanh'  # Для генерации пертурбаций


  attn_dropout: 0.05
  d_ff: 512
  d_model: 256
  dropout: 0.1
  # eps: 1
  # lr: 0.001
  n_heads: 4
  n_layers: 2
  # n_steps: 1
  norm: LayerNorm
  patch_len: 64
  revin: false
  stride: 32
  # train_eps: 0.5


hyperparameters_vary:
  dropout:
    optuna_type: float
    low: 0.1
    high: 0.7
    step: 0.1

attack_train_mode: True
