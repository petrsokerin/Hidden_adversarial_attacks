dataset:
  name: PowerCons
  num_classes: 2
  seq_len: 144
  total_object_count: 360
  train:
    object_count: 180
    max: 6.150072421276428
    mean: -1.7736155479814228e-16
    min: -0.9882441283924925
    std: 0.9999999999999999
    median: -0.4639090210070178
    roughness: 0.15408237025050991
  test:
    object_count: 180
    max: 6.002890636747172
    mean: -0.010892417367795152
    min: -1.0250395745248067
    std: 0.9910649059168454
    median: -0.4823067440731748
    roughness: 0.1544105925399531
model:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
attack_model:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
disc_model_reg:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
disc_model_check:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
attack:
  name: PGDAttack
  short_name: pgd_attack
  named_params:
  - eta
  - n_steps
  attack_params:
    n_steps: 10
    eta: 0.5
    norm: null
  hyperparameters_vary:
    eps:
      optuna_type: float
      low: 0.01
      high: 0.5
      log: true
    n_steps:
      optuna_type: const
      value: 50
slice: false
use_disc_check: false
test_run: false
exp_name: _test
exp_model_name: test
log_clearml: false
clearml_project: AA_train_discriminator
author: ''
load_weights_classifier: false
load_weights_disc: false
project_weights: AA_train_classifier_GOLDEN
project_weights_disc: AA_train_discriminator_GOLDEN
delete_weights_disc: false
model_folder: checkpoints/${dataset.name}/${attack_model.name}/${exp_model_name}
disc_path: results/${dataset.name}/${attack_model.name}/discriminator/fgsm_attack
save_path: results/${dataset.name}/${attack_model.name}/discriminator/${attack.short_name}${exp_name}
model_id_attack: 100
model_id: 100
train_self_supervised: true
criterion_name: BCELoss
criterion_params: null
metric_effect: F1
metric_hid: ROC_AUC_DISC
batch_size: 64
estimator_batch_size: null
device: cuda:0
print_every: 1
list_check_model_params: null
transform_data:
- _target_: tsai.data.transforms.TSRandomResizedCrop
  magnitude: 0.1
training_params:
  model_name: ${model.name}
  model_params: ${model.params}
  criterion_name: BCELoss
  criterion_params: null
  optimizer_name: Adam
  optimizer_params:
    lr: 0.0001
  scheduler_name: StepLR
  scheduler_params:
    step_size: 50
    gamma: 0.9
  attack_scheduler_name: StepAttackScheduler
  attack_scheduler_params:
    attack_step_size: 10
    attack_gamma: 0.8
    param_name: eps
  n_epochs: 30
  print_every: ${print_every}
  early_stop_patience: 900
enable_optimization: false
optuna_optimizer:
  n_trials: 3
  sampler:
    _target_: optuna.samplers.TPESampler
    seed: 0
  pruner:
    _target_: optuna.pruners.MedianPruner
  optim_metric: f1
  hyperparameters_vary:
    attack_name:
      optuna_type: const
      value: ${attack.name}
    attack_params: ${attack.hyperparameters_vary}
    model_name:
      optuna_type: const
      value: ${model.name}
    model_params: ${model.hyperparameters_vary}
    criterion_name:
      optuna_type: const
      value: BCELoss
    criterion_params:
      optuna_type: const
      value: None
    optimizer_name:
      optuna_type: choice
      choices:
      - Adam
      - AdamW
    optimizer_params:
      lr:
        optuna_type: float
        low: 0.0001
        high: 0.01
        log: true
    scheduler_name:
      optuna_type: const
      value: StepLR
    scheduler_params:
      optuna_type: const
      value:
        step_size: 10
        gamma: 0.5
    attack_scheduler_name:
      optuna_type: const
      value: StepAttackScheduler
    attack_scheduler_params:
      optuna_type: const
      value:
        attack_step_size: 10
        attack_gamma: 0.8
    n_epochs:
      optuna_type: const
      value: 3
    early_stop_patience:
      optuna_type: const
      value: None
