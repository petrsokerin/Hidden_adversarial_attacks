disc_model_reg:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
disc_model_check:
  name: ResidualCNN
  params:
    c_in: 1
    c_out: 1
    coord: false
    separable: false
    zero_norm: false
  hyperparameters_vary:
    c_in:
      optuna_type: const
      value: 1
    c_out:
      optuna_type: const
      value: 1
  attack_train_mode: false
attack:
  name: PGDRegDiscAttack
  short_name: pgd_disc_attack
  named_params:
  - eta
  - n_steps
  - alpha
  attack_params:
    n_steps: 50
    eta: 0.01
    alpha: 0.01
    norm: null
    use_sigmoid: false
    criterion: BCELoss
  list_reg_model_params:
  - model_id: 0
    model_name: pgd_attack__eta=0.5_nsteps=10
  hyperparameters_vary:
    eps:
      optuna_type: float
      low: 0.01
      high: 0.5
      log: true
    n_steps:
      optuna_type: const
      value: 50
slice: false
use_disc_check: true
test_run: false
exp_name: _test
exp_model_name: test
exp_disc_name: _test
log_clearml: false
clearml_project: AA_attack_run
author: ''
load_weights_classifier: false
load_weights_disc: false
project_weights: AA_train_classifier_GOLDEN
project_weights_disc: AA_train_discriminator_GOLDEN
delete_weights_disc: false
model_folder: checkpoints/${dataset.name}/${attack_model.name}/${exp_model_name}
disc_path: results/${dataset.name}/${attack_model.name}/discriminator/${attack.short_name}${exp_name}
save_path: results/${dataset.name}/${attack_model.name}/attack/${attack.short_name}${exp_name}
model_id_attack: 100
criterion_name: BCELoss
criterion_params: null
batch_size: 64
estimator_batch_size: null
device: cuda:0
metric_effect: F1
metric_hid: ROC_AUC_DISC
list_check_model_params:
- model_ResidualCNN_100_PowerCons_attack_pgd_attack__eta=0.5__n_steps=10
enable_optimization: false
optuna_optimizer:
  n_trials: 5
  sampler:
    _target_: optuna.samplers.TPESampler
    seed: 0
  pruner:
    _target_: optuna.pruners.MedianPruner
  optim_metric: F1
  hyperparameters_vary: ${attack.hyperparameters_vary}
