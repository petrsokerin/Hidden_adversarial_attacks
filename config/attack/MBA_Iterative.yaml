name: IterativeMBAPatchTSTAttack
short_name: mba_iterative_attack
named_params: [eps, n_steps, alpha, momentum_mu]

attack_params:
  eps: 0.5
  n_steps: 10
  alpha: null  # Will be set to eps/n_steps if null
  clamp: null
  rand_init: true
  use_sign: false
  equal_eps: false
  bpda: true
  proj: "none"  # "none" | "linf" | "l2"
  proj_equal_eps: false
  momentum_mu: 0.0
  step_normalize: null  # "meanabs" | "l2" | "linf" | null
  step_noise_std: 0.0

attacker_model_params:
  name: AttackPatchTST
  params:
    hidden_dim: 128
    x_dim: 1
    activation_type: "tanh"
  patch_kwargs:
    seq_len: 144
    n_layers: 3
    n_heads: 8
    d_model: 512
    d_ff: 2048
    dropout: 0.4
    patch_len: 28
    stride: 24
    revin: true
    res_attention: true
  path: "checkpoints/attackers/attacker_AttackPatchTST_100_PowerCons.pth"

