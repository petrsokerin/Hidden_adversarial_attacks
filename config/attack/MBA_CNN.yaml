name: MBACNNAttack
short_name: mba_cnn_attack
named_params: [eps, n_steps]

attack_params:
  eps: 0.5
  n_steps: 1
  clamp: null

attacker_model_params:
  name: AttackResidualCNN
  params:
    hidden_dim: 128
    x_dim: 1
    activation_type: "tanh"
  path: "checkpoints/attackers/attacker_AttackResidualCNN_100_PowerCons.pth"

hyperparameters_vary:
  eps:
    optuna_type: float
    low: 0.1
    high: 2.0
    log: true
  n_steps:
    optuna_type: const
    value: 1
