# @package _global_

defaults:
  - dataset: PowerCons
  - attacker_model: AttackLSTM
  - _self_

# Training parameters
epochs: 50
lr: 1e-4
alpha_l2: 1e-3
eps: 0.5
patience: 4
verbose_every: 1
is_debugged: false
is_clamped: false

# Model parameters
model_id: 100
device: "cuda"

# Paths
model_folder: "checkpoints"
save_path: "results"
attacker_save_path: "checkpoints/attackers"

# Logging
log_clearml: false
author: ""
project_name: "attacker_training"

# Data parameters
batch_size: 64
slice: false

# Victim model parameters
victim_model:
  name: "ResidualCNN"
  params:
    c_in: 1
    c_out: 1
  attack_train_mode: false
  path: "checkpoints/PowerCons/ResidualCNN/test/model_ResidualCNN_100_PowerCons.pt"

# Surrogate model parameters (will be overridden by surrogate_model config)
surrogate_model:
  name: "AttackLSTM"
  params:
    hidden_dim: 64
    x_dim: 1
    activation_type: "identity"
    dropout: 0.25
    num_layers: 3

# Optimizer parameters
optimizer:
  name: "Adam"
  params:
    lr: 1e-4
    weight_decay: 0.0

# Scheduler parameters
scheduler:
  name: "StepLR"
  params:
    step_size: 10
    gamma: 0.5

# Criterion
criterion_name: "CrossEntropyLoss"
criterion_params: {}
