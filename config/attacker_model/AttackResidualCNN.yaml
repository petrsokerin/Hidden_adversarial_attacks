name: AttackResidualCNN
short_name: attack_rescnn

model_params:
  hidden_dim: 128
  x_dim: 1
  activation_type: "tanh"

hyperparameters_vary:
  hidden_dim:
    optuna_type: categorical
    choices: [64, 128, 256, 512]
  activation_type:
    optuna_type: categorical
    choices: ["identity", "tanh", "relu"]
  rescnn_kwargs:
    nf:
      optuna_type: categorical
      choices: [32, 64, 128]
    do:
      optuna_type: float
      low: 0.0
      high: 0.5
      step: 0.1
