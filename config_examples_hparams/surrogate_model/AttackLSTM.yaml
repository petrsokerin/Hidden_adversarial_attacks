name: AttackLSTM
short_name: attack_lstm

model_params:
  hidden_dim: 64
  x_dim: 1
  activation_type: "identity"
  dropout: 0.25
  num_layers: 3

hyperparameters_vary:
  hidden_dim:
    optuna_type: categorical
    choices: [32, 64, 128, 256]
  activation_type:
    optuna_type: categorical
    choices: ["identity", "tanh", "relu"]
  dropout:
    optuna_type: float
    low: 0.1
    high: 0.6
    step: 0.1
  num_layers:
    optuna_type: int
    low: 1
    high: 5
