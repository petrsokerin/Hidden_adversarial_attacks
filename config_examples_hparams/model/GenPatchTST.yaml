name: GenPatchTST

params:
  seq_len: ${dataset.seq_len}
  c_in: 1  # Входная размерность (1D последовательность)
  c_out: 1  # Выходная размерность канала (1D)
  pred_dim: ${dataset.seq_len}  # Размерность предсказания = длина последовательности


  padding_patch: True

  affine: False
  individual: False
  subtract_last: False
  decomposition: False
  kernel_size: 25
  activation: 'gelu'

  pre_norm: False
  res_attention: True
  store_attn: False
  activation_type: 'tanh'  # Для генерации пертурбаций


# ============================================
  attn_dropout: 0.0 # 0.25
  d_ff: 2048 # 512
  d_model: 512 # 256
  dropout: 0.3 # 0.1
  n_heads: 8
  n_layers: 2 # 4
  norm: 'BatchNorm'
  patch_len: 16 # 128
  revin: True # false
  stride: 8 # 16

# ============================================


hyperparameters_vary:
  dropout:
    optuna_type: float
    low: 0.1
    high: 0.7
    step: 0.1

attack_train_mode: True
