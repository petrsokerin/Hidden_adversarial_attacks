name: GenRNNA

params:
  seq_len: ${dataset.seq_len}
  c_in: 1 # ${dataset.num_dim} if multivariate
  c_out: 1 # ${dataset.n_classes} or 1 if binary
  hidden_size: 64 # 256
  rnn_layers: 1
  bias: True
  rnn_dropout: 0.0 # 0
  bidirectional: False # False
  encoder_layers: 2 # 3 5
  n_heads: 4
  d_ff: 256 # 128 2048
  encoder_dropout: 0.1
  act: 'gelu'

hyperparameters_vary:
  c_in:
    optuna_type: const
    value: 1
  c_out:
    optuna_type: const
    value: 1
  seq_len:
    optuna_type: const
    value: ${dataset.seq_len}
  hidden_size:
    optuna_type: choice
    choices: [32, 64, 128]
  rnn_layers:
    optuna_type: choice
    choices: [1, 2]
  bias:
    optuna_type: choice
    choices: [true, false]
  rnn_dropout:
    optuna_type: float
    low: 0.0
    high: 0.7
    step: 0.1
  bidirectional:
    optuna_type: choice
    choices: [true, false]
  encoder_layers:
    optuna_type: choice
    choices: [1, 2, 3, 4]
  n_heads:
    optuna_type: choice
    choices: [2, 4, 8]
  d_ff:
    optuna_type: choice
    choices: [128, 256, 512, 1024]
  encoder_dropout:
    optuna_type: float
    low: 0.0
    high: 0.5
    step: 0.1
  act:
    optuna_type: choice
    choices: [gelu, relu]


attack_train_mode: True
