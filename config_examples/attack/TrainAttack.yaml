name: TrainAttack
short_name: train_attack
named_params: [eps, n_steps]
is_trainable: True

attack_params:
  train_eps: 0.3
  eps: 0.3
  n_steps: 5
  is_clamp: False
  disc_alpha: 0.0
  use_sigmoid: True

# Optional discriminator regularization
#list_reg_model_params: []

batch_size: 64

training_params:
  alpha_l2: 0.001
  criterion_name: BCELoss
  criterion_params: None
  early_stop_patience: 30
  n_epochs: 100
  optimizer_name: Adam
  optimizer_params:
    lr: 0.001 # 0.0001
  print_every: 5
  scheduler_name: StepLR
  scheduler_params:
    gamma: 0.9
    step_size: 8
  train_self_supervised: false


hyperparameters_vary:
  train_eps:
    optuna_type: choice
    choices: [0.2, 0.3, 0.4]

  eps:
    optuna_type: choice
    choices: [0.4]

  n_steps:
    optuna_type: choice
    choices: [5, 20, 50] # [5, 20, 50] # [1]
  n_epochs:
    optuna_type: const
    value: 100

  patch_len:
    optuna_type: choice
    choices: [16, 32, 64, 128]

  stride:
    optuna_type: choice
    choices: [4, 8, 16, 32]

  dropout:
    optuna_type: choice
    choices: [0.1, 0.3, 0.6]
  attn_dropout:
    optuna_type: float
    low: 0.0
    high: 0.3
    step: 0.05

  n_layers:
    optuna_type: choice
    choices: [1, 2, 3, 4]

  d_model:
    optuna_type: choice
    choices: [128, 256, 512]

  d_ff:
    optuna_type: choice
    choices: [512, 1024, 2048]

  n_heads:
    optuna_type: choice
    choices: [4, 8]

  revin:
    optuna_type: choice
    choices: [true, false]

  norm:
    optuna_type: choice
    choices: [BatchNorm, LayerNorm]


  step_size:
    optuna_type: choice
    choices:
    - 5
    - 10
    - 20
  optimizer_name:
    optuna_type: choice
    choices:
    - Adam
    - AdamW
  lr:
    optuna_type: choice
    choices: [0.001, 0.01, 0.0001]
  gamma:
    optuna_type: choice
    choices:
    - 0.5
    - 0.8
    - 0.95
